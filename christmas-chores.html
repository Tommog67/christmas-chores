<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Press Start 2P',ui-monospace,Menlo,monospace;font-size:9px;line-height:1.6}
body{display:flex;justify-content:center;padding:8px}
#app{width:100%;max-width:520px}
.panel{background:var(--cream);border:4px solid var(--edge);outline:3px solid var(--wood);box-shadow:0 4px 0 #3a200e;padding:8px}
h1{font-size:12px;margin:0;color:var(--red);text-shadow:1px 1px 0 #fff8}
#top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
#top h1{font-size:10px;line-height:1.5}
#clock{background:var(--edge);color:#ffe9a8;padding:5px 8px;white-space:nowrap}
#wrap{position:relative;border:4px solid var(--edge);outline:3px solid var(--wood);margin-bottom:10px;background:#000}
canvas{display:block;width:100%;image-rendering:pixelated;touch-action:none}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000a;padding:12px}
#ov .panel{text-align:center;max-width:340px}
#sel{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000d;padding:12px;overflow:auto}
#sel .panel{text-align:center;max-width:360px;margin:auto}
#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 2px}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--wood);color:var(--ink);box-shadow:0 3px 0 var(--edge);padding:6px 2px;font-size:8px}
.card:hover{background:#d9a566}
.card canvas{width:48px;height:66px}
#music.off{opacity:.45;filter:grayscale(1)}
#music,#mute{padding:5px 7px;background:var(--wood);color:var(--ink);box-shadow:0 3px 0 var(--edge)}
button{font:inherit;color:#fff;background:var(--green);border:3px solid var(--edge);padding:8px 10px;cursor:pointer;box-shadow:0 3px 0 #2a4a24}
button:active{transform:translateY(2px);box-shadow:none}
button:focus-visible{outline:3px solid #ffd35a}
ul{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
li{display:flex;gap:6px;align-items:flex-start}
li i{flex:none;width:12px;height:12px;border:2px solid var(--edge);background:#fff8;font-style:normal;line-height:8px;color:var(--green)}
li.d{text-decoration:line-through;opacity:.55}
#pad{display:none;justify-content:space-between;align-items:center;margin-top:10px;user-select:none;-webkit-user-select:none}
@media(pointer:coarse){#pad{display:flex}}
.dp{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:2px}
.dp button{padding:0;font-size:14px;background:var(--wood);color:var(--ink);box-shadow:0 3px 0 var(--edge)}
#A{width:84px;height:84px;border-radius:50%;background:var(--red);box-shadow:0 4px 0 #6a1a16}
.hint{margin:8px 0 0;font-size:8px;opacity:.8}
</style></head><body>
<div id="app">

<div id="sel"><div class="panel"><h1>Who are you?</h1><p>Pick your character. The other friends will be hanging around the house.</p><div id="cards"></div></div></div>

addEventListener('keydown',e=>{if(e.key=='m'||e.key=='M'){mtog();return}const k=map[e.key.length>1?e.key:e.key.toLowerCase()];if(k){K[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=map[e.key.length>1?e.key:e.key.toLowerCase()];if(k)K[k]=0});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1});
